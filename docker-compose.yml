x-kafka: &kafka
  image: apache/kafka:4.3.2
  healthcheck: {test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null, interval: 5s, timeout: 20s, retries: 30}

x-kafka-env: &kafka-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_HEAP_OPTS: -Xms384m -Xmx384m

x-python-health: &python-health
  healthcheck: {test: python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')", interval: 3s, retries: 30}

services:
  kafka-1:
    <<: *kafka
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 1, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092}

  kafka-2:
    <<: *kafka
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 2, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092}

  kafka-3:
    <<: *kafka
    environment: {<<: *kafka-env, KAFKA_NODE_ID: 3, KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092}

  kafka-init:
    image: apache/kafka:4.3.2
    command: >-
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic movie-events
      --partitions 3 --replication-factor 3 --config min.insync.replicas=2
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
    ports: ["${SCHEMA_REGISTRY_PORT:-8081}:8081"]
    healthcheck: {test: python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects')", interval: 3s, retries: 30}
    depends_on: {kafka-init: {condition: service_completed_successfully}}

  clickhouse:
    image: clickhouse/clickhouse-server:26.11
    environment: {CLICKHOUSE_SKIP_USER_SETUP: 1}
    volumes: [./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro]
    healthcheck: {test: clickhouse-client -q 'SELECT * FROM top_movies LIMIT 0', interval: 3s, retries: 30}
    depends_on: {schema-registry: {condition: service_healthy}}

  postgres:
    image: postgres:18
    environment: {POSTGRES_DB: analytics, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
    healthcheck: {test: pg_isready -U postgres, interval: 2s, retries: 30}

  postgres-migrate:
    image: flyway/flyway:13
    command: -url=jdbc:postgresql://postgres:5432/analytics -user=postgres -password=postgres -locations=filesystem:/flyway/migrations migrate
    volumes: [./aggregator/migrations:/flyway/migrations]
    depends_on: {postgres: {condition: service_healthy}}

  s3:
    image: rustfs/rustfs:1.0.6
    environment: {RUSTFS_ACCESS_KEY: rustfsadmin, RUSTFS_SECRET_KEY: rustfsadmin}
    ports: ["${S3_CONSOLE_PORT:-9001}:9001"]
    healthcheck: {test: curl -sf localhost:9000/health, interval: 2s, retries: 30}

  producer:
    build: {context: ., args: {SERVICE: producer}}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      GENERATOR_ENABLED: "true"
    ports: ["${PRODUCER_PORT:-8010}:8000"]
    <<: *python-health
    depends_on: {schema-registry: {condition: service_healthy}}

  aggregator:
    build: {context: ., args: {SERVICE: aggregator}}
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/analytics
      S3_ENDPOINT: http://s3:9000
      S3_ACCESS_KEY: rustfsadmin
      S3_SECRET_KEY: rustfsadmin
      AGGREGATION_INTERVAL_SECONDS: 60
    ports: ["${AGGREGATOR_PORT:-8020}:8000"]
    <<: *python-health
    depends_on:
      clickhouse: {condition: service_healthy}
      postgres-migrate: {condition: service_completed_successfully}
      s3: {condition: service_healthy}

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cinema.json
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/cinema.yml:ro
      - ./grafana/cinema.json:/var/lib/grafana/dashboards/cinema.json:ro
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    healthcheck: {test: curl -sf localhost:3000/api/health, interval: 3s, retries: 60}

  test:
    image: python:3.13-slim
    command: python /tests/test_pipeline.py
    volumes: [./tests:/tests:ro]
    profiles: [test]
    depends_on:
      producer: {condition: service_healthy}
      aggregator: {condition: service_healthy}
